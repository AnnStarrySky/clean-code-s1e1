<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link 
    href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hero">
    <img
      class="hero__img" 
      src="./eisenhower-matrix.jpg" 
      alt="eisenhower matrix">
    <a 
      class="hero__info-matrix" 
      href="https://goal-life.com/page/method/matrix-eisenhower">
      Want more details?
    </a>
  </div>
  <div class="todo-block">
    <div id="todo-block__add-item">
      <label class="todo-block__label-new-task" for="todo-block__new-task">Add Item</label>
      <div class="todo-block__task-row">
        <input 
          id="todo-block__new-task" 
          class="todo-block__input todo-block__input-new-task" 
          type="text">
        <button class="todo-block__btn-add btn">Add</button>
      </div>
    </div>
    <h3 class="todo-block__title">Todo</h3>
    <ul id="todo-block__incomplete-tasks">
      <li class="todo-block__task">
        <input class="todo-block__checkbox" type="checkbox">
        <label class="todo-block__task-label">Pay Bills</label>
        <input 
          type="text" 
          class="todo-block__input">
        <button class="todo-block__btn-edit btn">Edit</button>
        <button class="todo-block__btn-delete btn">
          <img 
            src="./remove.svg" 
            alt="button delete">
        </button>
      </li>
      <li class="todo-block__task todo-block__task--edit-mode">
        <input type="checkbox" class="todo-block__checkbox">
        <label class="todo-block__task-label">Go Shopping</label>
        <input 
          type="text" 
          value="Go Shopping" 
          class="todo-block__input">
        <button class="todo-block__btn-edit btn">Save</button>
        <button class="todo-block__btn-delete btn">
            <img 
              src="./remove.svg" 
              alt="button delete">
        </button>
      </li>
    </ul>
    <h3 class="todo-block__title">Completed</h3>
    <ul id="todo-block__completed-tasks">
      <li class="todo-list__task">
        <input type="checkbox" checked class="todo-block__checkbox">
        <label class="todo-block__task-label">See the Doctor</label>
        <input 
          type="text" 
          class="todo-block__input">
        <button class="todo-block__btn-edit btn">Edit</button>
        <button class="todo-block__btn-delete btn">
            <img 
              src="./remove.svg" 
              alt="button delete">
        </button>
      </li>
    </ul>
  </div>
<script src="app.js"></script>
</body>
</html>
