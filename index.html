<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link 
    href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hero">
    <img
      class="hero__img" 
      src="./eisenhower-matrix.jpg" 
      alt="eisenhower matrix">
    <a 
      class="hero__info-matrix" 
      href="https://goal-life.com/page/method/matrix-eisenhower">
      Want more details?
    </a>
  </div>
  <div class="todo-block">
    <p id="todo-block__add-item">
      <label class="todo-list__label" for="new-task">Add Item</label>
      <div class="todo-block__task">
        <input 
          id="new-task" 
          class="todo-block__input" 
          type="text">
        <button class="todo-block__btn-add btn">Add</button>
      </div>
    </p>
    <h3 class="todo-block__title">Todo</h3>
    <ul id="todo-block__incomplete-tasks">
      <li class="todo-block__task">
        <input class="todo-block__checkbox" type="checkbox">
        <label class="todo-block__task-label">Pay Bills</label>
        <input 
          type="text" 
           class="todo-block__input-edit">
        <button class="todo-block__btn-edit btn">Edit</button>
        <button class="todo-block__btn-delete btn">
          <img 
            src="./remove.svg" 
            alt="button delete">
        </button>
      </li>
      <li class="editMode">
        <input type="checkbox">
        <label class="task">Go Shopping</label>
        <input 
          type="text" 
          value="Go Shopping" 
          class="task">
        <button class="edit">Save</button>
        <button class="delete">
            <img 
              src="./remove.svg" 
              alt="button delete">
        </button>
      </li>
    </ul>
    <h3>Completed</h3>
    <ul id="completed-tasks">
      <li>
        <input type="checkbox" checked>
        <label class="task">See the Doctor</label>
        <input type="text" class="task">
        <button class="edit">Edit</button>
        <button class="delete">
            <img 
              src="./remove.svg" 
              alt="button delete">
        </button>
      </li>
    </ul>
  </div>
<script src="app.js"></script>
</body>
</html>
